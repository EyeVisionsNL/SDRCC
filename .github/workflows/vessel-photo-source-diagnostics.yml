name: Vessel photo source diagnostics (one-time)

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/vessel-photo-source-diagnostics.yml'
      - 'scripts/diagnose_photo_sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-photo-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source HTTP responses, identities, photo metadata
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/diagnose_photo_sources.py
