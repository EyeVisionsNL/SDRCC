name: SDRCC Mobile UI validation

on:
  push:
    branches:
      - develop
    paths:
      - 'dashboard/static/mobile/index.html'
      - 'scripts/install/update_manifest.json'
      - 'VERSION'
      - 'scripts/validate_mobile_ui.py'
      - '.github/workflows/mobile-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui-check:
    name: Validate Mobile styling and photo attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Web UI, photo credits and updater allowlist
        run: python3 scripts/validate_mobile_ui.py
      - name: Validate credited De Binnenvaart photo fallback
        run: python3 scripts/validate_debinnenvaart_photo.py
