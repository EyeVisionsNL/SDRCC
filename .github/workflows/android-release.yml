name: SDRCC Mobile Signed Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate Android source
        run: python3 android/scripts/validate_android_beta.py

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate private signing key availability
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SDRCC_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SDRCC_ANDROID_SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SDRCC_ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SDRCC_ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEY_ALIAS STORE_PASS KEY_PASS; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required Android signing secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sdrcc-mobile-release.p12"
          chmod 600 "$RUNNER_TEMP/sdrcc-mobile-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/sdrcc-mobile-release.p12" \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Build and test unsigned release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SDRCC_ANDROID_SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SDRCC_ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SDRCC_ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          "$SIGNER" sign --ks "$RUNNER_TEMP/sdrcc-mobile-release.p12" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/SDRCC-Mobile.apk" "$APK"
          "$SIGNER" verify --verbose "$RUNNER_TEMP/SDRCC-Mobile.apk"
          test -s "$RUNNER_TEMP/SDRCC-Mobile.apk"

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^ *versionCode +([0-9]+).*$/\1/p' android/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -nE "s/^ *versionName +'([^']+)'.*$/\1/p" android/app/build.gradle | head -1)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish immutable versioned GitHub APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="sdrcc-mobile-v$VERSION_CODE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump Android versionCode before publishing."
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP/SDRCC-Mobile.apk#SDRCC-Mobile.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "SDRCC Mobile $VERSION_NAME ($VERSION_CODE)" \
            --notes "Signed SDRCC Mobile APK for private station access. Android confirms installation." \
            --latest=false

      - name: Publish update feed after APK release
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="sdrcc-mobile-v$VERSION_CODE"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SDRCC-Mobile.apk"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$URL" <<'PY'
          import json, pathlib, sys
          target = pathlib.Path("android/update.json")
          payload = {
              "version_code": int(sys.argv[1]),
              "version_name": sys.argv[2],
              "apk_url": sys.argv[3],
          }
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/update.json
          git commit -m "Android: publish signed mobile APK update metadata for $TAG"
          git push origin HEAD:develop
