name: Receiver recovery validation

on:
  push:
    branches: [develop]
    paths:
      - 'core/receiver_manager.py'
      - 'dashboard/app.py'
      - 'tests/test_receiver_manual_recovery.py'
      - 'dashboard/static/js/receiver_inventory.js'
      - 'scripts/install/update_manifest.json'
      - '.github/workflows/receiver-recovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all deployed Python before release
        run: python -m compileall -q core dashboard
      - name: Validate receiver recovery JavaScript
        run: node --check dashboard/static/js/receiver_inventory.js
      - name: Install minimal test requirements
        run: python -m pip install PyYAML
      - name: Guarded recovery regression tests
        run: python -m unittest discover -s tests -p test_receiver_manual_recovery.py -v
