name: Rensen-Driessen photo tests

on:
  push:
    branches: [develop]
    paths:
      - 'core/traffic_voice_rensendriessen*.py'
      - 'ais_atis_bridge/rensendriessen*.py'
      - 'tests/test_rensen_driessen*.py'
      - '.github/workflows/rensen-photo-tests.yml'
  workflow_dispatch:

jobs:
  photo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Run offline photo and watermark tests
        run: python -m unittest discover -s tests -p 'test_rensen_driessen*.py' -v

      - name: Validate SDRCC update manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          mapping = json.loads(Path("scripts/install/update_manifest.json").read_text())
          invalid = []
          for name, allowed in mapping.items():
              if name == "scripts/install/update_manifest.json":
                  continue
              path = Path(name)
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() not in allowed:
                  invalid.append(name)
          if invalid:
              raise SystemExit("Invalid SDRCC manifest entries: " + ", ".join(invalid))
          print(f"PASS: {len(mapping)-1} approved update file hashes")
          PY
