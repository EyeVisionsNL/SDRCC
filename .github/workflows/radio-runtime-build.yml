name: Radio runtime build compatibility

on:
  push:
    branches: [develop, main]
    paths:
      - 'scripts/install/provision_external.sh'
      - 'scripts/install/upgrade_radio_runtimes.py'
      - 'scripts/install/patch_rtlsdr_airband_auto_gain.py'
      - 'scripts/install/patch_rtlsdr_airband_scan_interval.py'
      - 'core/traffic_voice.py'
      - 'config/traffic_voice.yaml'
      - '.github/workflows/radio-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-airband:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config libconfig++-dev libfftw3-dev libmp3lame-dev libshout3-dev librtlsdr-dev
      - name: Run actual Airband update build from outside any Git repository
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd /tmp
          python3 - <<'PY'
          from pathlib import Path
          import os
          import tempfile
          from scripts.install.upgrade_radio_runtimes import build_airband_candidate

          project = Path(os.environ["GITHUB_WORKSPACE"])
          with tempfile.TemporaryDirectory(prefix="sdrcc-airband-ci-") as staging:
              candidate = build_airband_candidate(project, Path(staging))
              assert candidate.is_file()
              assert candidate.stat().st_size > 10000
              print("PASS: official v6.2.0 and both SDRCC patches compiled from a non-Git worker cwd")
          PY

      - name: Validate Airband 6.2.0 settings with actual SDRCC Python dependencies
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          python3 - <<'PY'
          from pathlib import Path
          from scripts.install.upgrade_radio_runtimes import (
              AIRBAND_OLD_SHA, AIRBAND_SHA, validate_airband_configuration
          )
          project = Path.cwd()
          old = (project / "config/traffic_voice.yaml").read_text(encoding="utf-8")
          assert old.count("    version: 5.2.0\n") == 1
          assert old.count("    commit: " + AIRBAND_OLD_SHA + "\n") == 1
          proposed = old.replace("    version: 5.2.0\n", "    version: 6.2.0\n").replace(
              "    commit: " + AIRBAND_OLD_SHA + "\n",
              "    commit: " + AIRBAND_SHA + "\n")
          validate_airband_configuration(project, proposed)
          print("PASS: Airband 6.2.0 validates using SDRCC venv dependencies")
          PY

  pinned-readsb:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install readsb Debian package build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git build-essential debhelper libusb-1.0-0-dev pkg-config fakeroot libncurses-dev zlib1g-dev libzstd-dev librtlsdr-dev help2man
      - name: Build pinned readsb 3.16.20 package
        run: |
          git clone --quiet https://github.com/wiedehopf/readsb.git /tmp/readsb-source
          git -C /tmp/readsb-source checkout --quiet dadfa3307a1951b7ef687cfe3fd66cdb708a4f6f
          test "$(git -C /tmp/readsb-source rev-parse HEAD)" = dadfa3307a1951b7ef687cfe3fd66cdb708a4f6f
          test "$(cat /tmp/readsb-source/version)" = "3.16.20"
          cd /tmp/readsb-source
          export DEB_BUILD_OPTIONS=noddebs
          dpkg-buildpackage -b -ui -uc -us --build-profiles=rtlsdr
          dpkg-deb -f /tmp/readsb_*.deb Package | grep -Fx readsb
          mkdir -p /tmp/readsb-extracted
          dpkg-deb -x /tmp/readsb_*.deb /tmp/readsb-extracted
          test -x /tmp/readsb-extracted/usr/bin/readsb
          /tmp/readsb-extracted/usr/bin/readsb --version 2>&1 | grep -F '3.16.20'
          /tmp/readsb-extracted/usr/bin/readsb --version 2>&1 | grep -F 'git: v3.16.20'

