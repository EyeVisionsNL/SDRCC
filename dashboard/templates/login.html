<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inloggen · SDRCC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e5edf6;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:390px;background:#192536;border:1px solid #34465d;border-radius:16px;padding:30px}h1{margin:0;color:#68c8ff}p{line-height:1.5;color:#b5c6d9}label{display:block;margin:20px 0 6px}input,button{width:100%;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #61728a;background:#101722;color:white}button{margin-top:24px;background:#68c8ff;color:#101722;border:0;cursor:pointer;font-weight:700}.error{color:#ffb3a8}a{color:#68c8ff}
</style></head><body><main><h1>SDRCC</h1><p>SDR Control Center</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ '/login/code' if stage == 'code' else '/login' }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
{% if stage == 'code' %}
<label for="code">Code uit je authenticator-app</label>
<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
<button type="submit">Inloggen</button><p><a href="/login">Opnieuw beginnen</a></p>
{% else %}
<label for="username">Gebruikersnaam</label><input id="username" name="username" autocomplete="username" maxlength="80" required autofocus>
<label for="password">Wachtwoord</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="1024" required>
<button type="submit">Verder</button>
{% endif %}</form></main></body></html>
