<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1792" height="208" viewBox="-512 0 1792 208">
  <title>SDRCC Intelligence — extended desktop panorama</title>
  <desc>Original panorama with the existing UFO shifted 120 pixels left and 20 pixels down. The original composition is retained at the right; the unobstructed left sky and sea extend the desktop framing.</desc>
  <defs>
    <image id="panorama" width="1280" height="208" xlink:href="data:image/webp;base64,"/>
    <filter id="feather" x="-30%" y="-45%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="skyPatch" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="208">
      <rect x="919" y="-14" width="210" height="91" rx="10" fill="white" filter="url(#feather)"/>
    </mask>
    <mask id="ufoPatch" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="208">
      <rect x="925" y="-10" width="196" height="85" rx="10" fill="white" filter="url(#feather)"/>
    </mask>
    <clipPath id="desktopLeft"><rect x="-512" y="0" width="512" height="208"/></clipPath>
    <linearGradient id="desktopFade" gradientUnits="userSpaceOnUse" x1="-512" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".18" stop-color="white" stop-opacity=".12"/>
      <stop offset=".68" stop-color="white" stop-opacity=".85"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="desktopExtension" maskUnits="userSpaceOnUse" x="-512" y="0" width="512" height="208">
      <rect x="-512" y="0" width="512" height="208" fill="url(#desktopFade)"/>
    </mask>
  </defs>
  <!-- Extend the quiet left edge continuously; the right 1280px remain unchanged. -->
  <g clip-path="url(#desktopLeft)" mask="url(#desktopExtension)"><use xlink:href="#panorama" transform="scale(-1 1)"/></g>
  <use xlink:href="#panorama"/>
  <!-- Fill the old UFO position from the unobstructed neighboring sky. -->
  <g mask="url(#skyPatch)"><use xlink:href="#panorama" transform="translate(218 0)"/></g>
  <!-- Relocate the original UFO, with softly blended sky at its edges. -->
  <g transform="translate(-120 20)"><use xlink:href="#panorama" mask="url(#ufoPatch)"/></g>
</svg>
