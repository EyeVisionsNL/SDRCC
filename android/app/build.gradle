plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.eyevisions.sdrcc.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.eyevisions.sdrcc.mobile'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // A release APK needs a private signing key; the public beta is debug only.
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
